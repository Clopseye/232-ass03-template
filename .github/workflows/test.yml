name: Run Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout student repository
      uses: actions/checkout@v4

    - name: Install 32-bit compilation tools (multilib)
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y gcc-multilib g++-multilib

    - name: Build Unity for Linux
      run: |
        curl -L -s -o lib/unity.c \
          https://raw.githubusercontent.com/ThrowTheSwitch/Unity/master/src/unity.c
        gcc -Wall -m32 -Ilib -c lib/unity.c -o lib/unity_linux.o

    - name: Download latest test binary
      run: |
        mkdir -p tests

        TASK_NUM=$(echo "${{ github.event.repository.name }}" | grep -oP '(ass|lab)\K[0-9]+')
        if [ -z "$TASK_NUM" ]; then
          TASK_NUM="01"
        fi

        echo "Detected task number: $TASK_NUM"

        TEST_URL="https://raw.githubusercontent.com/jpach-cs/232-all-public-tests/main/tests${TASK_NUM}.o"
        echo "Downloading test binary from: $TEST_URL"
        curl -L -s -o tests/tests.o "$TEST_URL"

        if [ ! -s tests/tests.o ]; then
          echo "ERROR: Failed to download test binary or file is empty!"
          exit 1
        fi

    - name: Compile student code with pre-compiled test
      run: |
        gcc -Wall -m32 -Isrc -Ilib \
            src/code.c src/tests.c \
            lib/unity_linux.o tests/tests.o \
            -o run_tests

    - name: Execute Test Binary
      run: |
        ./run_tests